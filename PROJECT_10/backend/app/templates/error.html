{% extends "base.html" %}
{% block title %}{{ status_code }} · {{ message }}{% endblock %}
{% block content %}
<section class="error-page">
  <p class="eyebrow">Error {{ status_code }}</p>
  <h1>{{ message }}</h1>
  <p class="lede">Nothing was changed. Go back, reload, and try again.</p>
  <p><a class="btn btn-primary" href="{{ '/' if user else '/login' }}">{{ 'Back to the desk' if user else 'Sign in' }}</a></p>
</section>
{% endblock %}
