{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth">
  <section class="auth-pitch">
    <a class="brand big" href="/"><span class="moon" aria-hidden="true"></span>Shutdown</a>
    <h1>A calmer end to <em>every</em> workday.</h1>
    <p class="muted">Your tasks, notes and reviews stay private to your account.</p>
  </section>
  <form class="card auth-form" method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ form_csrf }}">
    <input type="hidden" name="timezone" value="UTC" data-browser-timezone>
    <h2>Create your account</h2>
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    <label>Name <input name="name" autocomplete="name" maxlength="80" required value="{{ values.name or '' }}"></label>
    <label>Email <input name="email" type="email" autocomplete="email" required value="{{ values.email or '' }}"></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
    <button class="btn primary">Create account</button>
    <p class="muted">Already have one? <a href="/login">Sign in</a></p>
  </form>
</div>
{% endblock %}
